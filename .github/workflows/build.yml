name: Build PS1 ISO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build jq unzip wget curl

      - name: Cache PSn00bSDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /tmp/psn00bsdk
          key: psn00bsdk-linux-v1

      - name: Download PSn00bSDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e

          ASSET_URL=$(curl -fsSL \
            https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest \
            | jq -r '
                .assets[]
                | select(.name | startswith("PSn00bSDK-"))
                | select(.name | endswith("-Linux.zip"))
                | .browser_download_url
              ' | head -n 1)

          if [ -z "$ASSET_URL" ]; then
            echo "ERRO: PSn00bSDK não encontrado!"
            exit 1
          fi

          echo "Baixando: $ASSET_URL"

          wget -q --show-progress "$ASSET_URL" -O psn00bsdk.zip

          rm -rf /tmp/psn00bsdk
          mkdir -p /tmp/psn00bsdk
          unzip -q psn00bsdk.zip -d /tmp/psn00bsdk

      - name: Locate SDK root
        shell: bash
        run: |
          set -e

          SDK_CMAKE=$(find /tmp/psn00bsdk -type f -name sdk.cmake | head -n 1)

          if [ -z "$SDK_CMAKE" ]; then
            echo "ERRO: sdk.cmake não encontrado!"
            find /tmp/psn00bsdk -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "sdk.cmake: $SDK_CMAKE"

          SDK_ROOT=$(dirname "$(dirname "$(dirname "$SDK_CMAKE")")")

          echo "SDK_ROOT=$SDK_ROOT"
          echo "PSN00BSDK_LIBS=$SDK_ROOT/libpsn00b" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin" >> "$GITHUB_PATH"

      - name: Fix project compatibility
        shell: bash
        run: |
          set -e

          echo "Corrigindo chamadas FntPrint..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("main.c")
          s = p.read_text()

          s = s.replace(
              'FntPrint("APERTE X - QUADRO DO NESTON\\n");',
              'FntPrint(0, "APERTE X - QUADRO DO NESTON\\n");'
          )

          s = s.replace(
              'FntPrint("\\n\\n\\n  SE CADA UM DER 1 REAL\\n   -NESTON QUE JOGA\\n\\n   [O] FECHAR");',
              'FntPrint(0, "\\n\\n\\n  SE CADA UM DER 1 REAL\\n   -NESTON QUE JOGA\\n\\n   [O] FECHAR");'
          )

          p.write_text(s)
          PY

          echo "Corrigindo include guard de neston_tex.h..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("neston_tex.h")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "#ifndef NESTON_TEX_H\n#define NESTON_TEX_H",
                  "#ifndef NESTON_TEX_H_INCLUDED\n#define NESTON_TEX_H_INCLUDED"
              )

              p.write_text(s)
          PY

          echo "=== Trecho corrigido de main.c ==="
          grep -n "FntPrint" main.c || true

          echo "=== neston_tex.h ==="
          cat neston_tex.h || true

      - name: Configure
        shell: bash
        run: |
          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" \
            -S .

      - name: Build
        shell: bash
        run: |
          cmake --build build --verbose

      - name: Show build output
        if: always()
        run: |
          echo "=== Arquivos gerados ==="
          find build -type f | sort

      - name: Upload BIN/CUE
        uses: actions/upload-artifact@v4
        with:
          name: sala-do-neston-ps1
          path: |
            build/**/*.bin
            build/**/*.cue
            build/*.bin
            build/*.cue
          if-no-files-found: error
